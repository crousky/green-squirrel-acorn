name: Deploy Azure Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - name: Deploy Infrastructure
        id: deploy
        run: |
          # Get the object ID of the current service principal for Key Vault access
          SP_OBJECT_ID=$(az ad sp show --id ${{ secrets.AZURE_CLIENT_ID }} --query id --output tsv)
          
          az deployment group create \
            --resource-group rg-green-squirrel \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --parameters keyVaultAccessPrincipalId="$SP_OBJECT_ID" \
            --verbose
      
      - name: Get Deployment Outputs
        id: outputs
        run: |
          HOSTNAME=$(az deployment group show \
            --resource-group rg-green-squirrel \
            --name main \
            --query properties.outputs.staticWebAppHostname.value \
            --output tsv)
          
          APPINSIGHTS=$(az deployment group show \
            --resource-group rg-green-squirrel \
            --name main \
            --query properties.outputs.appInsightsConnectionString.value \
            --output tsv)
          
          KV_NAME=$(az deployment group show \
            --resource-group rg-green-squirrel \
            --name main \
            --query properties.outputs.keyVaultName.value \
            --output tsv)
          
          echo "Static Web App Hostname: $HOSTNAME"
          echo "Application Insights configured: ${APPINSIGHTS:0:50}..."
          echo "Key Vault Name: $KV_NAME"
          echo "::notice title=Deployment Complete::Visit https://$HOSTNAME to view your app"
          echo "::notice title=Key Vault::Set secrets manually in Key Vault: $KV_NAME"
      
      - name: Azure Logout
        if: always()
        run: az logout
